# Makes the model of Media Downloader's Tools > Separate voice, music and effects: BandIt v2's multilingual checkpoint
# (Watcharasupat, Wu and Orife, CC BY-SA 4.0) converted to ONNX by separator-model/bandit_export.py, which checks it
# against the model itself, and with onnxruntime 1.24.4 (the version the app downloads) against PyTorch: any of it off
# fails the run before anything is released.
# Every Monday it looks whether BandIt has a new checkpoint (a new version of its Zenodo record) or new model code (a new
# commit of kwatcharasupat/bandit-v2), against what the newest separator-models-v<n> release was made from (its notes'
# "Source:" line), and makes the model again when it has; or run it by hand (Actions > Sound separator model > Run
# workflow), which always makes it. Each new model goes on a pre-release of its own, separator-models-v<n+1>: the app
# takes the newest published one (SoundSeparator.CheckModelAsync), as it does whisper.cpp's builds, and deleting it puts
# every copy back on the one before. A model the same as the newest published one (new code that changed nothing) isn't
# released again: that release's "Source:" line is brought up to date instead. Published by a scheduled run, or by hand
# with Publish ticked; else a draft, which the app skips until it is published by hand (Releases > the draft > Edit >
# Publish release). Always a pre-release, never the latest release: the app's own update check reads that one.
name: Sound separator model

on:
  schedule:
    # Mondays 02:00 UTC (09:00 in Vietnam), after the whisper.cpp build
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      zenodo_record:
        description: Zenodo record of the checkpoint (12701995), or empty for the newest version of BandIt v2's record
        required: false
        default: ''
      bandit_ref:
        description: Commit of kwatcharasupat/bandit-v2 whose model code is used, or empty for its newest
        required: false
        default: ''
      publish:
        description: Publish it straight away, not as a draft (every copy of the app then takes it)
        type: boolean
        required: false
        default: false

permissions:
  # To make the pre-release
  contents: write

env:
  # BandIt v2's checkpoints on Zenodo: the first version of the record, whose newest version is looked for
  ZENODO_RECORD: '12701995'
  RELEASE_PREFIX: separator-models-v

jobs:
  # What to make it from (the checkpoint and BandIt's code), under which release, and whether: a run by hand always; a
  # scheduled run only when either is new since the newest release
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tag: ${{ steps.pick.outputs.tag }}
      record: ${{ steps.pick.outputs.record }}
      checkpoint_url: ${{ steps.pick.outputs.checkpoint_url }}
      checkpoint_md5: ${{ steps.pick.outputs.checkpoint_md5 }}
      commit: ${{ steps.pick.outputs.commit }}
      source: ${{ steps.pick.outputs.source }}
    steps:
      - name: Pick the source and the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TYPED_RECORD: ${{ inputs.zenodo_record }}
          TYPED_REF: ${{ inputs.bandit_ref }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          if [ -n "$TYPED_RECORD" ]; then api="https://zenodo.org/api/records/$TYPED_RECORD"
          else api="https://zenodo.org/api/records/$ZENODO_RECORD/versions/latest"; fi
          json=$(curl -sL --fail --retry 3 "$api")
          record=$(jq -r .id <<< "$json")
          url=$(jq -r '.files[] | select(.key == "checkpoint-multi.ckpt") | .links.self' <<< "$json")
          md5=$(jq -r '.files[] | select(.key == "checkpoint-multi.ckpt") | .checksum' <<< "$json" | sed 's/^md5://')
          if [ -z "$url" ] || [ -z "$md5" ]; then echo "Zenodo record $record has no checkpoint-multi.ckpt"; exit 1; fi
          if [ -n "$TYPED_REF" ]; then commit=$(gh api "repos/kwatcharasupat/bandit-v2/commits/$TYPED_REF" --jq .sha)
          else commit=$(gh api repos/kwatcharasupat/bandit-v2/commits/main --jq .sha); fi
          source="checkpoint $md5, bandit-v2 $commit"

          # The newest separator-models release, draft or published, and what it was made from
          newest=$(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
            --jq "[.[] | select(.tagName | test(\"^${RELEASE_PREFIX}[0-9]+\$\")) | .n = (.tagName | ltrimstr(\"$RELEASE_PREFIX\") | tonumber)] | max_by(.n) // empty | \"\(.n) \(.isDraft) \(.tagName)\"")
          if [ -z "$newest" ]; then
            tag="${RELEASE_PREFIX}1"; made_from=""
          else
            read -r n draft newest_tag <<< "$newest"
            made_from=$(gh release view "$newest_tag" --repo "$repo" --json body --jq .body | grep -oE 'Source: checkpoint [0-9a-f]+, bandit-v2 [0-9a-f]+' | sed 's/^Source: //' || true)
            # A draft is made again in its place; a published one is never changed: the next number
            if [ "$draft" = true ]; then tag="$newest_tag"; else tag="$RELEASE_PREFIX$((n + 1))"; fi
          fi
          # And the newest published one's: a model the same as it updates its Source: line, not a draft's, which is
          # left as it was (made from an older source)
          published=$(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | test(\"^${RELEASE_PREFIX}[0-9]+\$\")) | .n = (.tagName | ltrimstr(\"$RELEASE_PREFIX\") | tonumber)] | max_by(.n) // empty | .tagName")
          published_from=""
          if [ -n "$published" ]; then
            published_from=$(gh release view "$published" --repo "$repo" --json body --jq .body | grep -oE 'Source: checkpoint [0-9a-f]+, bandit-v2 [0-9a-f]+' | sed 's/^Source: //' || true)
          fi

          build=true
          if [ "${{ github.event_name }}" = schedule ] && { [ "$source" = "$made_from" ] || [ "$source" = "$published_from" ]; }; then build=false; fi
          echo "BandIt now: Zenodo record $record, $source"
          echo "Newest release: ${newest:-none}, made from: ${made_from:-not said}"
          echo "Newest published: ${published:-none}, made from: ${published_from:-not said}"
          echo "Build: $build, as $tag"
          { echo "build=$build"; echo "tag=$tag"; echo "record=$record"; echo "checkpoint_url=$url"
            echo "checkpoint_md5=$md5"; echo "commit=$commit"; echo "source=$source"; } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Get this repository (the script)
        uses: actions/checkout@v4

      - name: Get BandIt v2's code at ${{ needs.check.outputs.commit }}
        uses: actions/checkout@v4
        with:
          repository: kwatcharasupat/bandit-v2
          ref: ${{ needs.check.outputs.commit }}
          path: bandit-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyTorch for the processor (no graphics card on the runner, none needed); onnxruntime of the app's version
      - name: Install PyTorch, ONNX and onnxruntime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchaudio
          python -m pip install numpy onnx onnxscript tqdm onnxruntime==1.24.4
          python -m pip freeze | grep -iE '^(torch|torchaudio|onnx|onnxscript|onnxruntime|numpy)=='

      - name: Download the checkpoint (Zenodo record ${{ needs.check.outputs.record }})
        env:
          CHECKPOINT_URL: ${{ needs.check.outputs.checkpoint_url }}
          CHECKPOINT_MD5: ${{ needs.check.outputs.checkpoint_md5 }}
        run: |
          curl -L --fail --retry 3 -o checkpoint-multi.ckpt "$CHECKPOINT_URL"
          echo "$CHECKPOINT_MD5  checkpoint-multi.ckpt" | md5sum -c -

      - name: Convert to ONNX and check it
        run: python -I separator-model/bandit_export.py --repo bandit-v2 --ckpt checkpoint-multi.ckpt --out bandit-v2-multi.onnx --check-onnx

      - name: Describe it
        id: describe
        run: |
          size=$(stat -c %s bandit-v2-multi.onnx)
          sha=$(sha256sum bandit-v2-multi.onnx | cut -d' ' -f1)
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bandit-v2-multi.onnx: $size bytes, SHA-256 $sha, from ${{ needs.check.outputs.source }}" >> "$GITHUB_STEP_SUMMARY"
          cat > bandit-v2-multi.NOTICE.txt <<EOF
          bandit-v2-multi.onnx: the multilingual checkpoint (checkpoint-multi) of BandIt v2, from
          "Remastering Divide and Remaster: A Cinematic Audio Source Separation Dataset with Multilingual Support"
          by Karn N. Watcharasupat, Chih-Wei Wu and Iroro Orife (https://arxiv.org/abs/2407.07275),
          from https://zenodo.org/records/${{ needs.check.outputs.record }}, converted to ONNX without changing its weights, with the
          model code of https://github.com/kwatcharasupat/bandit-v2 at ${{ needs.check.outputs.commit }}.
          It takes a sound apart into speech, music and effects.
          License: Creative Commons Attribution-ShareAlike 4.0 International (https://creativecommons.org/licenses/by-sa/4.0/);
          the converted model is under the same license.
          EOF

      - name: Keep the model
        uses: actions/upload-artifact@v4
        with:
          name: bandit-v2-multi-onnx
          path: |
            bandit-v2-multi.onnx
            bandit-v2-multi.NOTICE.txt

      # Not released when it is the newest published model again (its Source: line brought up to date instead); else on
      # its release: a draft made again in its place, or a new one, published by a scheduled run or with Publish ticked
      - name: Put it on a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SOURCE: ${{ needs.check.outputs.source }}
          RECORD: ${{ needs.check.outputs.record }}
          SIZE: ${{ steps.describe.outputs.size }}
          SHA256: ${{ steps.describe.outputs.sha256 }}
          PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'
          source_line="Source: $SOURCE (Zenodo record $RECORD)."

          # The newest published model: the same file needn't be downloaded again by every copy
          published=$(gh release list --repo "$repo" --limit 100 --json tagName,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.tagName | test(\"^${RELEASE_PREFIX}[0-9]+\$\")) | .n = (.tagName | ltrimstr(\"$RELEASE_PREFIX\") | tonumber)] | max_by(.n) // empty | .tagName")
          if [ -n "$published" ]; then
            body=$(gh release view "$published" --repo "$repo" --json body --jq .body)
            if grep -q "SHA-256 $SHA256" <<< "$body"; then
              body=$(sed -E '/^Source: /d' <<< "$body")
              gh release edit "$published" --repo "$repo" --notes "$body

          $source_line"
              echo "The same model as $published (SHA-256 $SHA256): nothing released, its Source: line brought up to date" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          notes="Not a Media Downloader release. The model of Tools > Separate voice, music and effects: BandIt v2's multilingual checkpoint (Watcharasupat, Wu and Orife) converted to ONNX by run ${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}, and checked against PyTorch with onnxruntime 1.24.4. $SIZE bytes, SHA-256 $SHA256. License: CC BY-SA 4.0, as the checkpoint's (bandit-v2-multi.NOTICE.txt).

          "
          if [ "$PUBLISH" = true ]; then
            notes+="Published by the run once its checks passed: every copy of Media Downloader takes it at its next separation, as the newest separator-models pre-release."
            draft=()
          else
            notes+="A draft: test it, then Publish release. Every copy of Media Downloader then takes it at its next separation, as the newest separator-models pre-release."
            draft=(--draft)
          fi
          notes+="

          $source_line"

          if is_draft=$(gh release view "$TAG" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then echo "$TAG is published already"; exit 1; fi
            gh release upload "$TAG" bandit-v2-multi.onnx bandit-v2-multi.NOTICE.txt --repo "$repo" --clobber
            gh release edit "$TAG" --repo "$repo" --notes "$notes"
            if [ "$PUBLISH" = true ]; then gh release edit "$TAG" --repo "$repo" --draft=false --prerelease --latest=false; fi
          else
            gh release create "$TAG" bandit-v2-multi.onnx bandit-v2-multi.NOTICE.txt --repo "$repo" "${draft[@]}" --prerelease --latest=false \
              --target "${{ github.sha }}" --title "Sound separator model (BandIt v2, ONNX)" --notes "$notes"
          fi
          gh release view "$TAG" --repo "$repo" --json tagName,isDraft,isPrerelease --jq '"\(.tagName) draft: \(.isDraft), pre-release: \(.isPrerelease)"'
