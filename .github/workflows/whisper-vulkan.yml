# Builds whisper.cpp for Windows with Vulkan, so Media Downloader's Make from speech can run on NVIDIA, AMD and Intel
# graphics cards: whisper.cpp publishes CUDA builds only (NVIDIA, and without the cuBLAS they need). The same options as
# its official Windows build otherwise: the backends load at run time (the graphics card when Vulkan finds one, else the
# processor), with a build for each processor generation.
# Every Monday it looks whether whisper.cpp has a version not built yet, and builds that one; or run it by hand (Actions >
# whisper.cpp Vulkan build > Run workflow), for a version, or empty for the newest. The zip is tested: its whisper-cli
# hears whisper.cpp's own sample on the processor, as the app runs it (the runner has no graphics card). It is kept as the
# run's artifact, and put on a pre-release whisper-vulkan-<version>: published by a scheduled run, or by hand with Publish
# ticked; else a draft, which Media Downloader skips, until it is published by hand (Releases > the draft > Edit >
# Publish release). A zip that fails the test is only ever a draft, and the run fails, so it is told. Published, every
# copy of the app takes it, as the newest. Always a pre-release, never the latest release: the app's own update check
# reads that one.
name: whisper.cpp Vulkan build

on:
  schedule:
    # Mondays 01:00 UTC (08:00 in Vietnam)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      whisper_version:
        description: whisper.cpp tag to build (v1.9.6), or empty for its newest release when not built yet
        required: false
        default: ''
      vulkan_sdk:
        description: Vulkan SDK version (LunarG)
        required: true
        default: 1.4.363.0
      publish:
        description: Publish it straight away when it passes the test, not as a draft (every copy of the app then takes it)
        type: boolean
        required: false
        default: false

permissions:
  # To make the pre-release
  contents: write

env:
  # The Vulkan SDK of a scheduled run (a run by hand says its own)
  VULKAN_SDK_VERSION: ${{ inputs.vulkan_sdk || '1.4.363.0' }}

jobs:
  # Which version to build, and whether: one typed by hand is always built; otherwise whisper.cpp's newest release, unless
  # its draft or pre-release is there already
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the version
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TYPED: ${{ inputs.whisper_version }}
        run: |
          if [ -n "$TYPED" ]; then
            echo "version=$TYPED" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $TYPED, as asked"
            exit 0
          fi
          version=$(gh release view --repo ggml-org/whisper.cpp --json tagName --jq .tagName)
          if [ -z "$version" ]; then echo "whisper.cpp's newest release couldn't be read"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "whisper-vulkan-$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "whisper.cpp's newest is $version, and whisper-vulkan-$version is there already (draft or published): nothing to build"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "whisper.cpp's newest is $version, not built yet: building it"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    env:
      WHISPER_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Get whisper.cpp ${{ needs.check.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ needs.check.outputs.version }}

      - name: Install the Vulkan SDK ${{ env.VULKAN_SDK_VERSION }}
        shell: pwsh
        run: |
          $version = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$version"
          curl.exe -L --fail -o vulkansdk.exe "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList '--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (-not (Test-Path "$root\Bin\glslc.exe")) { throw "The Vulkan SDK didn't install: no glslc.exe in $root\Bin" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGGML_VULKAN=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release -j 4

      - name: Package
        shell: pwsh
        run: |
          $out = 'whisper-vulkan'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build\bin\Release\whisper-cli.exe, build\bin\Release\*.dll $out
          Copy-Item LICENSE $out\LICENSE-whisper.cpp.txt
          $env:WHISPER_VERSION | Set-Content $out\version.txt
          Compress-Archive -Path "$out\*" -DestinationPath whisper-vulkan-x64.zip
          Get-ChildItem $out | Format-Table Name, Length

      # As the app runs it, on the processor: the zip's whisper-cli with the voice detector hears whisper.cpp's sample
      # (JFK, in English) with the smallest English model. A zip that can't is never published
      - name: Test it
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          curl.exe -L --fail --retry 3 -o ggml-silero-v6.2.0.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          & .\whisper-vulkan\whisper-cli.exe -m ggml-tiny.en.bin -f samples\jfk.wav -l en -ng -otxt -of jfk --vad -vm ggml-silero-v6.2.0.bin
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli stopped with exit code $LASTEXITCODE" }
          $text = Get-Content jfk.txt -Raw
          "Heard: $text"
          if ($text -notmatch 'ask not what your country can do for you') { throw "whisper-cli didn't hear the sample right" }

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: whisper-vulkan-x64-${{ needs.check.outputs.version }}
          path: whisper-vulkan-x64.zip

      # Published by a scheduled run, or by hand with Publish ticked, when the test passed; else a draft. The zip replaced
      # when a draft of that tag is there already (a build run again), and that draft published when asked; a published
      # one is left as it is, as copies of the app may have it
      - name: Put it on a pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish) && steps.test.outcome == 'success' && 'true' || 'false' }}
          TEST: ${{ steps.test.outcome }}
        run: |
          $tag = "whisper-vulkan-$env:WHISPER_VERSION"
          $repo = '${{ github.repository }}'
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null | ConvertFrom-Json
          if ($existing -and -not $existing.isDraft) { throw "$tag is published already: delete it on GitHub first to build it again" }
          $publish = $env:PUBLISH -eq 'true'
          if ($existing) {
            gh release upload $tag whisper-vulkan-x64.zip --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "The zip couldn't be put on the draft $tag" }
            if ($publish) { gh release edit $tag --repo $repo --draft=false --prerelease --latest=false }
          } else {
            $notes = "Not a Media Downloader release. whisper.cpp $env:WHISPER_VERSION built for Windows x64 with Vulkan (Vulkan SDK $env:VULKAN_SDK_VERSION) by run ${{ github.server_url }}/$repo/actions/runs/${{ github.run_id }}, for Media Downloader's Make from speech: it runs on NVIDIA, AMD and Intel graphics cards, and on the processor. whisper.cpp is MIT-licensed (LICENSE-whisper.cpp.txt in the zip).`n`n"
            if ($publish) {
              $notes += "Published by the run once its whisper-cli heard whisper.cpp's sample: every copy of Media Downloader takes it, as the newest whisper-vulkan pre-release."
              $draft = @()
            } else {
              $notes += if ($env:TEST -ne 'success') { "A draft, as it failed the run's test (whisper-cli hearing whisper.cpp's sample): look at the run before publishing it. " } else { "A draft: " }
              $notes += "test the zip, then Publish release. Every copy of Media Downloader then takes it, as the newest whisper-vulkan pre-release."
              $draft = @('--draft')
            }
            gh release create $tag whisper-vulkan-x64.zip --repo $repo @draft --prerelease --latest=false --target ${{ github.sha }} --title "whisper.cpp $env:WHISPER_VERSION with Vulkan (for Make from speech)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "The pre-release couldn't be made" }
          gh release view $tag --repo $repo --json isDraft,isPrerelease --jq '"draft: \(.isDraft), pre-release: \(.isPrerelease)"'

      # The run fails when the test did, so it is told (GitHub's email), with the zip kept as a draft
      - name: Fail when the test did
        if: steps.test.outcome != 'success'
        shell: pwsh
        run: |
          throw "The zip failed its test (Test it): it was left as a draft, not published"
